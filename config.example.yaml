# Example configuration file for NotifyMe
# Copy to config.yaml and edit values as needed.

telegram:
  bot_token: ""
  chat_id: ""
  alert_chat_id: ""

x_account:
  username: ""
  email: ""
  password: ""
  totp_secret: ""
  list_id: ""
  cookies_path: "data/cookies.json"

poll:
  # Poll interval in seconds (default: 180s = 3 minutes)
  interval_seconds: 180
  # Random jitter added to sleep time to appear more natural (0 to 10s)
  jitter_max_seconds: 10

filters:
  # Tweet types to forward:
  include_replies: false
  include_retweets: false
  include_quotes: false

  # Keywords to filter (case-insensitive substring matches)
  keyword_allowlist: []
  keyword_blocklist: []

  # Per-account filter overrides
  # Handles should be lowercase without '@'
  account_overrides: {}

alerts:
  # Consecutive errors before sending alert
  max_consecutive_failures: 5
  # Alert if no successful polls in this many minutes
  inactivity_alert_minutes: 10
  # Minimum minutes between repeated alerts of the same type
  alert_cooldown_minutes: 30

web:
  enabled: true
  host: "127.0.0.1"
  port: 8080

storage:
  db_path: "data/notifyme.db"
